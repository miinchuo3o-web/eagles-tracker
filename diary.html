<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="지출관리"/>
<meta name="theme-color" content="#1F1D1A"/>
<title>💰 지출관리</title>
<style>
:root{
  --bg:#1F1D1A;--card:#2A2825;--bar:#262421;--line:#3A3733;
  --accent:#BA7517;--accent-dark:#854F0B;--text:#F1EFE8;--sub:#A8A59C;--mute:#8A8782;
  --inc:#9CC57A;--exp:#E8765F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;min-height:100vh;}
button{font-family:inherit;cursor:pointer;color:inherit;}
input{font-family:inherit;color:var(--text);}

.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.auth-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;}
.auth-logo{font-size:40px;text-align:center;}
.auth-title{font-size:20px;font-weight:700;text-align:center;margin-top:6px;}
.auth-sub{font-size:12px;color:var(--sub);text-align:center;margin:4px 0 18px;}
.auth-tabs{display:flex;gap:8px;margin-bottom:14px;}
.auth-tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:none;font-size:13px;color:var(--sub);}
.auth-tab.active{background:var(--accent-dark);border-color:var(--accent);color:#FFF8E8;}
.auth-field{margin-bottom:10px;}
.auth-field label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}
.auth-field input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;outline:none;}
.auth-field input:focus{border-color:var(--accent);}
.btn-auth{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent-dark);color:#FFF8E8;font-size:15px;font-weight:600;margin-top:4px;}
.auth-err{color:var(--exp);font-size:12px;text-align:center;margin-top:10px;min-height:16px;}

.header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 8px;}
.header-title{font-size:17px;font-weight:700;}
.header-user{font-size:11px;color:var(--sub);margin-top:2px;}
.btn-logout{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--sub);}

.page{display:none;padding:0 14px calc(190px + env(safe-area-inset-bottom));}
.page.active{display:block;}
.month-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 12px;}
.month-nav button{background:none;border:none;font-size:20px;color:var(--sub);padding:4px 10px;}
.month-nav span{font-size:16px;font-weight:600;min-width:110px;text-align:center;}

.chips{display:flex;gap:8px;margin-bottom:14px;}
.chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;}
.chip .l{font-size:11px;color:var(--sub);}
.chip .v{font-size:15px;font-weight:700;margin-top:3px;}
.chip.inc .v{color:var(--inc);}.chip.exp .v{color:var(--exp);}

.day-head{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:14px 2px 6px;}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px;width:100%;text-align:left;}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;color:#1F1D1A;white-space:nowrap;}
.item .memo{flex:1;font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .amt{font-size:14px;font-weight:700;}
.amt.inc{color:var(--inc);}.amt.exp{color:var(--exp);}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:50px 0;line-height:1.7;}

.toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px;}
.toggle button{flex:1;padding:9px;border:none;background:none;border-radius:9px;font-size:13px;color:var(--sub);}
.toggle button.on{background:var(--accent-dark);color:#FFF8E8;font-weight:600;}
.total-box{text-align:center;margin-bottom:16px;}
.total-box .l{font-size:12px;color:var(--sub);}
.total-box .v{font-size:26px;font-weight:700;margin-top:4px;}
.cat-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px;}
.cat-top{display:flex;align-items:center;gap:8px;font-size:13px;}
.dot{width:10px;height:10px;border-radius:50%;flex:none;}
.cat-top .n{flex:1;}
.cat-top .a{font-weight:600;}
.cat-top .p{width:44px;text-align:right;color:var(--sub);font-size:12px;}
.cat-bar{height:5px;background:var(--bg);border-radius:3px;margin-top:8px;overflow:hidden;}
.cat-bar i{display:block;height:100%;border-radius:3px;}

.fab{position:fixed;right:16px;bottom:calc(138px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:30;}

.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.stack{padding:9px 14px 4px;}
.stack-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.stack-row .lab{width:30px;font-size:11px;color:var(--sub);}
.stack-bar{flex:1;height:10px;border-radius:5px;background:var(--bg);display:flex;overflow:hidden;}
.stack-bar i{display:block;height:100%;}
.stack-row .sum{width:84px;text-align:right;font-size:11px;font-weight:600;}
.nav{display:flex;}
.nav button{flex:1;padding:10px 0 12px;background:none;border:none;font-size:12px;color:var(--mute);}
.nav button .ic{display:block;font-size:19px;margin-bottom:2px;}
.nav button.on{color:var(--accent);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;}
.overlay.show{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bar);border-radius:20px 20px 0 0;border:1px solid var(--line);z-index:50;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-height:92vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sheet-top b{font-size:15px;}
.sheet-top button{background:none;border:none;font-size:13px;color:var(--sub);padding:4px 6px;}
.sheet-top .del{color:var(--exp);}
.amount-input{width:100%;background:none;border:none;border-bottom:2px solid var(--line);font-size:34px;font-weight:700;text-align:right;padding:6px 2px;outline:none;margin:6px 0 14px;}
.amount-input:focus{border-color:var(--accent);}
.amount-input.exp{color:var(--exp);}.amount-input.inc{color:var(--inc);}
.sub-l{font-size:11px;color:var(--sub);margin:10px 0 6px;}
.cats{display:flex;flex-wrap:wrap;gap:7px;}
.cat-chip{padding:7px 13px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--sub);}
.cat-chip.on{color:#1F1D1A;font-weight:700;border-color:transparent;}
.field{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;outline:none;}
.field:focus{border-color:var(--accent);}
.btn-save{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;margin-top:16px;}
.btn-save:disabled{opacity:.5;}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000c;color:#fff;font-size:12px;padding:8px 14px;border-radius:16px;z-index:99;display:none;}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">💰</div>
    <div class="auth-title">지출관리</div>
    <div class="auth-sub">수입과 지출을 한눈에</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">로그인</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">회원가입</button>
    </div>
    <div class="auth-field"><label>아이디</label>
      <input type="text" id="authUsername" placeholder="아이디 입력" autocomplete="username"/></div>
    <div class="auth-field"><label>비밀번호</label>
      <input type="password" id="authPassword" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') submitAuth()"/></div>
    <button class="btn-auth" id="authSubmitBtn" onclick="submitAuth()">로그인</button>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<div id="mainScreen" style="display:none">
  <div class="header">
    <div><div class="header-title">💰 지출관리</div><div class="header-user" id="headerUser"></div></div>
    <button class="btn-logout" onclick="logout()">로그아웃</button>
  </div>

  <div class="page active" id="page-list">
    <div class="month-nav"><button onclick="moveMonth(-1)">‹</button><span class="mlabel"></span><button onclick="moveMonth(1)">›</button></div>
    <div class="chips">
      <div class="chip inc"><div class="l">수입</div><div class="v" id="sumInc">0</div></div>
      <div class="chip exp"><div class="l">지출</div><div class="v" id="sumExp">0</div></div>
      <div class="chip"><div class="l">잔액</div><div class="v" id="sumBal">0</div></div>
    </div>
    <div id="listBox"></div>
  </div>

  <div class="page" id="page-stats">
    <div class="month-nav"><button onclick="moveMonth(-1)">‹</button><span class="mlabel"></span><button onclick="moveMonth(1)">›</button></div>
    <div class="toggle">
      <button id="stExp" class="on" onclick="setStatKind('expense')">지출</button>
      <button id="stInc" onclick="setStatKind('income')">수입</button>
    </div>
    <div class="total-box"><div class="l" id="statLabel">이번 달 지출</div><div class="v" id="statTotal">0원</div></div>
    <div id="statBox"></div>
  </div>

  <button class="fab" onclick="openSheet()">+</button>

  <div class="bottom">
    <div class="stack">
      <div class="stack-row"><span class="lab">수입</span><div class="stack-bar" id="barInc"></div><span class="sum" id="barIncSum" style="color:var(--inc)"></span></div>
      <div class="stack-row"><span class="lab">지출</span><div class="stack-bar" id="barExp"></div><span class="sum" id="barExpSum" style="color:var(--exp)"></span></div>
    </div>
    <div class="nav">
      <button id="navList" class="on" onclick="showTab('list')"><span class="ic">🧾</span>내역</button>
      <button id="navStats" onclick="showTab('stats')"><span class="ic">📊</span>통계</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-top">
    <button onclick="closeSheet()">닫기</button>
    <b id="sheetTitle">내역 추가</b>
    <button class="del" id="btnDel" onclick="deleteEntry()" style="visibility:hidden">삭제</button>
  </div>
  <div class="toggle">
    <button id="kExp" class="on" onclick="setKind('expense')">지출</button>
    <button id="kInc" onclick="setKind('income')">수입</button>
  </div>
  <input class="amount-input exp" id="fAmount" type="text" inputmode="numeric" placeholder="0" oninput="fmtAmount()"/>
  <div class="sub-l">카테고리</div>
  <div class="cats" id="fCats"></div>
  <div class="sub-l">날짜</div>
  <input class="field" id="fDate" type="date"/>
  <div class="sub-l">메모 (선택)</div>
  <input class="field" id="fMemo" type="text" maxlength="100" placeholder="예: 점심 김치찌개"/>
  <button class="btn-save" id="btnSave" onclick="saveEntry()">저장</button>
</div>
<div class="toast" id="toast"></div>

<script>
const SERVER_URL = 'https://eagles-kbo-api-production.up.railway.app';
const CATS = {
  expense: [['먹기','#E8A33A'],['마시기','#A8794A'],['가족','#7FA65A'],['놀기','#5B8DD6'],['샤이니','#7FD1C7'],['야구','#D9553F'],['기타','#8A8782']],
  income:  [['급여','#7FA65A'],['용돈','#B5D18F'],['기타','#8A8782']]
};
const colorOf=(kind,cat)=>(CATS[kind].find(c=>c[0]===cat)||[0,'#8A8782'])[1];

let token=localStorage.getItem('diary_token')||'';
let username=localStorage.getItem('diary_username')||'';
let authMode='login';
let entries=[];
let now0=new Date(); let cur=new Date(now0.getFullYear(),now0.getMonth(),1);
let statKind='expense';
let fKind='expense', fCat='', editId=null;

const won=n=>Number(n).toLocaleString('ko-KR');
const monthKey=()=>`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`;
const todayStr=()=>new Intl.DateTimeFormat('fr-CA',{timeZone:'Asia/Seoul'}).format(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}

function switchAuthTab(mode){
  authMode=mode;
  document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('active',(i===0)===(mode==='login')));
  document.getElementById('authSubmitBtn').textContent=mode==='login'?'로그인':'회원가입';
  document.getElementById('authErr').textContent='';
}
async function submitAuth(){
  const u=document.getElementById('authUsername').value.trim();
  const p=document.getElementById('authPassword').value;
  const err=document.getElementById('authErr'); err.textContent='';
  if(!u||!p){err.textContent='아이디와 비밀번호를 입력해주세요';return;}
  const btn=document.getElementById('authSubmitBtn'); btn.disabled=true; btn.textContent='처리 중...';
  try{
    const res=await fetch(`${SERVER_URL}/auth/${authMode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await res.json();
    if(!res.ok){err.textContent=data.error||'오류가 발생했어요';return;}
    token=data.token; username=data.username;
    localStorage.setItem('diary_token',token); localStorage.setItem('diary_username',username);
    showMain();
  }catch(e){err.textContent='서버 연결 오류';}
  finally{btn.disabled=false;btn.textContent=authMode==='login'?'로그인':'회원가입';}
}
async function logout(){
  try{await fetch(`${SERVER_URL}/auth/logout`,{method:'POST',headers:{'Authorization':`Bearer ${token}`}});}catch(e){}
  token='';username='';entries=[];
  localStorage.removeItem('diary_token');localStorage.removeItem('diary_username');
  document.getElementById('mainScreen').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}
function showMain(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('mainScreen').style.display='block';
  document.getElementById('headerUser').textContent=`${username}님`;
  loadMonth();
}

async function api(path,opt={}){
  const res=await fetch(`${SERVER_URL}${path}`,{...opt,headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`}});
  if(res.status===401){logout();throw new Error('auth');}
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||'오류');
  return data;
}
async function loadMonth(){
  document.querySelectorAll('.mlabel').forEach(e=>e.textContent=`${cur.getFullYear()}년 ${cur.getMonth()+1}월`);
  try{ entries=await api(`/ledger?month=${monthKey()}`); }
  catch(e){ if(e.message!=='auth'){entries=[];toast('불러오기 실패');} }
  render();
}
function moveMonth(d){cur=new Date(cur.getFullYear(),cur.getMonth()+d,1);loadMonth();}

function sums(){
  const s={income:0,expense:0,byCat:{income:{},expense:{}}};
  entries.forEach(e=>{s[e.kind]+=e.amount; s.byCat[e.kind][e.category]=(s.byCat[e.kind][e.category]||0)+e.amount;});
  return s;
}
function renderStack(id,kind,s){
  const total=s[kind], el=document.getElementById(id);
  el.innerHTML = total? CATS[kind].filter(c=>s.byCat[kind][c[0]]).map(c=>`<i style="width:${s.byCat[kind][c[0]]/total*100}%;background:${c[1]}"></i>`).join('') : '';
  document.getElementById(kind==='income'?'barIncSum':'barExpSum').textContent=(kind==='income'?'+':'-')+won(total);
}
function render(){
  const s=sums();
  document.getElementById('sumInc').textContent=won(s.income);
  document.getElementById('sumExp').textContent=won(s.expense);
  const bal=s.income-s.expense, b=document.getElementById('sumBal');
  b.textContent=(bal<0?'-':'')+won(Math.abs(bal)); b.style.color=bal<0?'var(--exp)':'var(--text)';
  renderStack('barInc','income',s); renderStack('barExp','expense',s);

  const box=document.getElementById('listBox');
  if(!entries.length){box.innerHTML='<div class="empty">이 달의 내역이 없어요<br>+ 버튼으로 추가해보세요</div>';}
  else{
    const groups={};
    entries.forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
    box.innerHTML=Object.keys(groups).sort().reverse().map(d=>{
      const dt=new Date(d+'T00:00:00'), dow='일월화수목금토'[dt.getDay()];
      const net=groups[d].reduce((a,e)=>a+(e.kind==='income'?e.amount:-e.amount),0);
      return `<div class="day-head"><span>${dt.getMonth()+1}월 ${dt.getDate()}일 (${dow})</span><span>${net>=0?'+':'-'}${won(Math.abs(net))}</span></div>`+
        groups[d].map(e=>`<button class="item" onclick="openSheet(${e.id})">
          <span class="tag" style="background:${colorOf(e.kind,e.category)}">${esc(e.category)}</span>
          <span class="memo">${esc(e.memo||'')}</span>
          <span class="amt ${e.kind==='income'?'inc':'exp'}">${e.kind==='income'?'+':'-'}${won(e.amount)}</span></button>`).join('');
    }).join('');
  }
  renderStats(s);
}
function renderStats(s){
  s=s||sums();
  const total=s[statKind];
  document.getElementById('statLabel').textContent=`이번 달 ${statKind==='expense'?'지출':'수입'}`;
  const tv=document.getElementById('statTotal');
  tv.textContent=won(total)+'원';
  tv.style.color=statKind==='expense'?'var(--exp)':'var(--inc)';
  const rows=CATS[statKind].map(c=>[c[0],c[1],s.byCat[statKind][c[0]]||0]).filter(r=>r[2]>0).sort((a,b)=>b[2]-a[2]);
  document.getElementById('statBox').innerHTML=rows.length?rows.map(r=>{
    const p=total?r[2]/total*100:0;
    return `<div class="cat-row"><div class="cat-top"><span class="dot" style="background:${r[1]}"></span><span class="n">${r[0]}</span><span class="a">${won(r[2])}원</span><span class="p">${p.toFixed(0)}%</span></div><div class="cat-bar"><i style="width:${p}%;background:${r[1]}"></i></div></div>`;
  }).join(''):'<div class="empty">데이터가 없어요</div>';
}
function setStatKind(k){
  statKind=k;
  document.getElementById('stExp').classList.toggle('on',k==='expense');
  document.getElementById('stInc').classList.toggle('on',k==='income');
  renderStats();
}
function showTab(t){
  document.getElementById('page-list').classList.toggle('active',t==='list');
  document.getElementById('page-stats').classList.toggle('active',t==='stats');
  document.getElementById('navList').classList.toggle('on',t==='list');
  document.getElementById('navStats').classList.toggle('on',t==='stats');
  document.querySelector('.fab').style.display=t==='list'?'block':'none';
  window.scrollTo(0,0);
}

function setKind(k){
  fKind=k;
  document.getElementById('kExp').classList.toggle('on',k==='expense');
  document.getElementById('kInc').classList.toggle('on',k==='income');
  document.getElementById('fAmount').className='amount-input '+(k==='expense'?'exp':'inc');
  if(!CATS[k].some(c=>c[0]===fCat)) fCat='';
  renderCatChips();
}
function renderCatChips(){
  document.getElementById('fCats').innerHTML=CATS[fKind].map(c=>
    `<button class="cat-chip ${fCat===c[0]?'on':''}" style="${fCat===c[0]?'background:'+c[1]:''}" onclick="pickCat('${c[0]}')">${c[0]}</button>`).join('');
}
function pickCat(c){fCat=c;renderCatChips();}
function fmtAmount(){
  const el=document.getElementById('fAmount');
  const n=el.value.replace(/[^0-9]/g,'').replace(/^0+/,'');
  el.value=n?Number(n).toLocaleString('ko-KR'):'';
}
function openSheet(id){
  editId=id||null;
  const e=editId?entries.find(x=>x.id===editId):null;
  document.getElementById('sheetTitle').textContent=e?'내역 수정':'내역 추가';
  document.getElementById('btnDel').style.visibility=e?'visible':'hidden';
  fKind=e?e.kind:'expense'; fCat=e?e.category:'';
  document.getElementById('fAmount').value=e?won(e.amount):'';
  document.getElementById('fDate').value=e?e.date:todayStr();
  document.getElementById('fMemo').value=e?(e.memo||''):'';
  setKind(fKind);
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  if(!e) setTimeout(()=>document.getElementById('fAmount').focus(),250);
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  if(document.activeElement) document.activeElement.blur();
}
async function saveEntry(){
  const amount=parseInt(document.getElementById('fAmount').value.replace(/,/g,''),10)||0;
  const date=document.getElementById('fDate').value;
  if(amount<=0){toast('금액을 입력해주세요');return;}
  if(!fCat){toast('카테고리를 선택해주세요');return;}
  if(!date){toast('날짜를 선택해주세요');return;}
  const body=JSON.stringify({kind:fKind,category:fCat,amount,date,memo:document.getElementById('fMemo').value.trim()});
  const btn=document.getElementById('btnSave'); btn.disabled=true;
  try{
    if(editId) await api(`/ledger/${editId}`,{method:'PUT',body});
    else await api('/ledger',{method:'POST',body});
    closeSheet();
    const [y,m]=date.split('-').map(Number);
    cur=new Date(y,m-1,1);
    await loadMonth();
    toast('저장했어요');
  }catch(e){ if(e.message!=='auth') toast('저장 실패: '+e.message); }
  finally{btn.disabled=false;}
}
async function deleteEntry(){
  if(!editId||!confirm('이 내역을 삭제할까요?')) return;
  try{ await api(`/ledger/${editId}`,{method:'DELETE'}); closeSheet(); await loadMonth(); toast('삭제했어요'); }
  catch(e){ if(e.message!=='auth') toast('삭제 실패'); }
}

if(token) showMain(); else document.getElementById('authScreen').style.display='flex';
</script>
</body>
